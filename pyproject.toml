[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarlab"
version = "0.1.0"
description = "LunarLab — Reward Shaping Mission Control: reward-design experiments on Gymnasium LunarLander-v3 with PPO."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
# Exact versions live in requirements.lock (resolved with uv). These ranges
# document what the code was written and tested against.
dependencies = [
  "gymnasium==1.4.*",
  "Box2D==2.3.10",
  "pygame>=2.6",
  "stable-baselines3==2.9.*",
  "torch>=2.6",
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pyyaml>=6",
  "psutil>=6",
  "imageio>=2.35",
  "imageio-ffmpeg>=0.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
lunarlab = "lunarlab.cli:main"

[tool.setuptools.packages.find]
include = ["lunarlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: uses the real LunarLander environment (fast, but needs Box2D)",
  "slow: runs real PPO updates or video encoding (a few seconds to a minute)",
]
filterwarnings = [
  "ignore::DeprecationWarning:pygame.*",
  "ignore:pkg_resources is deprecated:UserWarning",
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
  # Starlette's TestClient now recommends the httpx2 package; httpx still works for these tests.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["frontend", "runs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]
