[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarlab"
# The single authoritative version is lunarlab.__version__ (lunarlab/__init__.py).
dynamic = ["version"]
description = "LunarLab — Reward Shaping Mission Control: auditing reward design on Gymnasium LunarLander-v3 with Stable-Baselines3 PPO and DQN."
readme = "README.md"
# Tested on 3.12 (CI on Linux and Windows); Box2D 2.3.10 and pygame 2.6.1 publish Windows wheels up to 3.13.
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Shayan Abrar" }]
keywords = ["reinforcement learning", "reward shaping", "reward hacking", "reproducibility", "evaluation"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Exact versions live in requirements.lock (resolved with uv). These ranges
# document what the code was written and tested against.
dependencies = [
  "gymnasium==1.4.*",
  "Box2D==2.3.10",
  "pygame>=2.6",
  "stable-baselines3==2.9.*",
  "torch>=2.6",
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pyyaml>=6",
  "psutil>=6",
  "imageio>=2.35",
  "imageio-ffmpeg>=0.5",
  "optuna>=5.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "hypothesis>=6", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://shayan-abrar.github.io/lunarlab/"
Repository = "https://github.com/SHAYAN-ABRAR/lunarlab"
Documentation = "https://github.com/SHAYAN-ABRAR/lunarlab/tree/main/docs"
Issues = "https://github.com/SHAYAN-ABRAR/lunarlab/issues"

[project.scripts]
lunarlab = "lunarlab.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lunarlab.__version__" }

[tool.setuptools.packages.find]
include = ["lunarlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: uses the real LunarLander environment (fast, but needs Box2D)",
  "slow: runs real PPO updates or video encoding (a few seconds to a minute)",
]
filterwarnings = [
  "ignore::DeprecationWarning:pygame.*",
  "ignore:pkg_resources is deprecated:UserWarning",
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
  # Starlette's TestClient now recommends the httpx2 package; httpx still works for these tests.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
# Statement + branch coverage of the whole package, including code run in worker subprocesses
# (`python -m lunarlab worker`) and spawned environment processes. Nothing is omitted.
source = ["lunarlab"]
branch = true
parallel = true
patch = ["subprocess"]
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
show_missing = true
# Only lines that can never run under test are excluded.
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py312"  # matches requires-python
extend-exclude = ["frontend", "runs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]
