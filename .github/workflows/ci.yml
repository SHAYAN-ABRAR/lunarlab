name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  python:
    name: Python · lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (CPU-only PyTorch, exact versions)
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements-ci.lock --torch-backend cpu
          uv pip install --python .venv/bin/python -e . --no-deps
      - name: Ruff (lint and formatting)
        run: |
          .venv/bin/python -m ruff check lunarlab tests tools examples paper
          .venv/bin/python -m ruff format --check lunarlab tests tools examples paper
      - name: Pytest with statement and branch coverage (unit, integration, property-based, end-to-end CLI)
        run: .venv/bin/python -m pytest -q --cov --cov-report=term --cov-report=json:coverage.json --cov-report=html:htmlcov
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: |
            coverage.json
            htmlcov
          retention-days: 30
      - name: Generated API reference, license headers and manuscript sources are current
        run: |
          .venv/bin/python tools/gen_api_docs.py --check
          .venv/bin/python tools/spdx_headers.py
          .venv/bin/python paper/jmlr-mloss/check_manuscript.py
      - name: Reproducibility smoke test (whole pipeline, no web UI)
        run: .venv/bin/python -m lunarlab reproduce-smoke --training-determinism --report reproduce-smoke-linux.json
      - name: Re-evaluate the supplied artifacts on Linux (observational; they were recorded on Windows)
        # Cross-platform bit-identity is not claimed: the reports record how many episodes match exactly.
        run: |
          for a in ppo-baseline-s0 ppo-hover-bonus-s0 dqn-baseline-s0; do
            .venv/bin/python -m lunarlab reproduce-artifact --artifact examples/artifacts/$a --report reproduce-$a-linux.json || true
          done
      - name: Upload the reproducibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-linux
          path: reproduce-*.json
          retention-days: 30

  source-archive:
    name: Source archive · deterministic build, fresh install, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build twice and compare byte for byte
        run: |
          python3 tools/build_source_archive.py --rev HEAD --out dist-a
          python3 tools/build_source_archive.py --rev HEAD --out dist-b
          cmp dist-a/lunarlab-*-src.tar.gz dist-b/lunarlab-*-src.tar.gz
      - name: Install the archive into a fresh environment and run its release tests
        run: python3 tools/build_source_archive.py --rev HEAD --out dist --verify
      - uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: dist
          retention-days: 30

  frontend:
    name: Frontend · typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  windows:
    # LunarLab's primary platform. Bounded: install, environment checks, the tests most exposed to
    # Windows behaviour (file locks, process groups, paths with spaces, video encoding), and the
    # PowerShell scripts. No training beyond tiny smoke budgets.
    # Python 3.13 was verified locally on Windows 11 (fast test subset and reproduce-smoke) before being added.
    name: Windows · Python ${{ matrix.python }} · install, locks, scripts
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (as scripts/setup.ps1 does; PyPI's Windows torch wheels are CPU builds)
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe -r requirements.lock
          uv pip install --python .venv\Scripts\python.exe -e . --no-deps
      - name: Doctor (Box2D, LunarLander reset/step, rendering, video encoder, SQLite, torch)
        run: .venv\Scripts\python.exe -m lunarlab doctor
      - name: Windows-sensitive tests (temporary paths contain spaces)
        run: >
          .venv\Scripts\python.exe -m pytest -q --basetemp "${{ runner.temp }}\lunar lab tmp"
          tests/test_windows.py tests/test_dqn_continuation.py tests/test_freeze.py tests/test_training.py
          tests/test_jobs.py tests/test_env_integration.py tests/test_video_rescoring.py tests/test_protocol.py
          tests/test_outcomes_v2.py tests/test_outcomes_stats_storage.py tests/test_reproduce.py
          tests/test_continuation_validation.py tests/test_audit_core.py tests/test_project_metadata.py
          tests/test_docs.py tests/test_source_archive.py
      - name: Reproducibility smoke test and re-evaluation of the supplied artifacts (the latter observational)
        run: |
          .venv\Scripts\python.exe -m lunarlab reproduce-smoke --training-determinism --report reproduce-smoke-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($a in 'ppo-baseline-s0', 'ppo-hover-bonus-s0', 'dqn-baseline-s0') {
            .venv\Scripts\python.exe -m lunarlab reproduce-artifact --artifact examples\artifacts\$a --report "reproduce-$a-windows.json"
          }
          exit 0
      - name: Upload the reproducibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-windows-py${{ matrix.python }}
          path: reproduce-*.json
          retention-days: 30
      - name: PowerShell scripts parse (PowerShell 7)
        run: |
          $failed = $false
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count) { $failed = $true; $errs | ForEach-Object { Write-Host "$($_.Extent.File): $($_.Message)" } }
          }
          if ($failed) { exit 1 }
      - name: Start and stop with the project scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\start.ps1 -Background -NoBrowser -Port 8799
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            try { $ok = ((Invoke-RestMethod http://127.0.0.1:8799/api/health -TimeoutSec 2).status -eq 'ok') } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { Write-Host 'the backend did not become healthy'; exit 1 }
          powershell -ExecutionPolicy Bypass -File scripts\stop.ps1 -Port 8799
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  e2e:
    name: Browser end-to-end (real backend)
    needs: [python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements-ci.lock --torch-backend cpu
          uv pip install --python .venv/bin/python -e . --no-deps
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        env:
          PW_CHANNEL: chromium
        run: npx playwright test
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
