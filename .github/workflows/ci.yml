name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  python:
    name: Python · lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (CPU-only PyTorch, exact versions)
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements-ci.lock --torch-backend cpu
          uv pip install --python .venv/bin/python -e . --no-deps
      - name: Ruff
        run: .venv/bin/python -m ruff check lunarlab tests
      - name: Pytest (unit, integration and slow tests with real PPO updates)
        run: .venv/bin/python -m pytest -q

  frontend:
    name: Frontend · typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  windows:
    # LunarLab's primary platform. Bounded: install, environment checks, the tests most exposed to
    # Windows behaviour (file locks, process groups, paths with spaces, video encoding), and the
    # PowerShell scripts. No training beyond tiny smoke budgets.
    name: Windows · install, locks, scripts
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (as scripts/setup.ps1 does; PyPI's Windows torch wheels are CPU builds)
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe -r requirements.lock
          uv pip install --python .venv\Scripts\python.exe -e . --no-deps
      - name: Doctor (Box2D, LunarLander reset/step, rendering, video encoder, SQLite, torch)
        run: .venv\Scripts\python.exe -m lunarlab doctor
      - name: Windows-sensitive tests (temporary paths contain spaces)
        run: >
          .venv\Scripts\python.exe -m pytest -q --basetemp "${{ runner.temp }}\lunar lab tmp"
          tests/test_windows.py tests/test_dqn_continuation.py tests/test_freeze.py tests/test_training.py
          tests/test_jobs.py tests/test_env_integration.py tests/test_video_rescoring.py tests/test_protocol.py
          tests/test_outcomes_v2.py tests/test_outcomes_stats_storage.py
      - name: PowerShell scripts parse (PowerShell 7)
        run: |
          $failed = $false
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count) { $failed = $true; $errs | ForEach-Object { Write-Host "$($_.Extent.File): $($_.Message)" } }
          }
          if ($failed) { exit 1 }
      - name: Start and stop with the project scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\start.ps1 -Background -NoBrowser -Port 8799
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            try { $ok = ((Invoke-RestMethod http://127.0.0.1:8799/api/health -TimeoutSec 2).status -eq 'ok') } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { Write-Host 'the backend did not become healthy'; exit 1 }
          powershell -ExecutionPolicy Bypass -File scripts\stop.ps1 -Port 8799
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  e2e:
    name: Browser end-to-end (real backend)
    needs: [python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements-ci.lock --torch-backend cpu
          uv pip install --python .venv/bin/python -e . --no-deps
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        env:
          PW_CHANNEL: chromium
        run: npx playwright test
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
