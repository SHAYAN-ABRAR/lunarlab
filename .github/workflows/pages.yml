name: Demo site

# Publishes the static, read-only demo (frontend in demo mode + the result snapshot in demo/api)
# to GitHub Pages. Pages has to be enabled with "GitHub Actions" as the source; private
# repositories on the free plan cannot use Pages, so the jobs are skipped there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend in demo mode
        working-directory: frontend
        env:
          VITE_DEMO: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm ci
          npm run build
      - name: Add the result snapshot and the single-page-app fallback
        run: |
          test -f demo/api/demo.json
          cp -r demo/api frontend/dist/demo-api
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
